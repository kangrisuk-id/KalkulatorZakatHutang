name: Build Android APK & AAB

on:
  workflow_dispatch:

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

       - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Create .env file if missing
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Release APK & AAB with Gradle
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease bundleRelease --no-daemon

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AplikasiZakatHutang-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn

      - name: Upload Release AAB Artifact (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: AplikasiZakatHutang-Release-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
