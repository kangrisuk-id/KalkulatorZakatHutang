name: Build Android APK & AAB

on:
  workflow_dispatch:

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Build Release APK & AAB with Gradle
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease bundleRelease --no-daemon

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AplikasiZakatHutang-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn

      - name: Upload Release AAB Artifact (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: AplikasiZakatHutang-Release-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
